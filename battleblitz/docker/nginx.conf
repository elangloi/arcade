# nginx config for the Battle Blitz game container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects so the game also works under a proxy path prefix
    # (e.g. /teen-titans-battle-blitz/ -> /teen-titans-battle-blitz/web/).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types application/javascript application/json text/css text/html;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # The game lives at /web/; send the root there. (Relative Location headers keep the
    # proxy prefix, which nginx's own directory redirect would drop.)
    location = / { return 302 web/; }
    location = /web { return 302 web/; }

    # Art and sound never change between builds -> cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Game code: always revalidate so updates show up after a rebuild.
    location /web/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
