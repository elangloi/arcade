# Home arcade stack.
#   docker compose up -d --build
# The proxy is the only thing published; games are reached through it by path.
# Add a game: build its image as a service here, add a `location` block in
# nginx/conf.d/arcade.conf and register it in frontend/src/lib/games.ts.

services:
  # nginx + the React front end (frontend/), built from the repo root.
  proxy:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: arcade/proxy:latest
    container_name: arcade-proxy
    restart: unless-stopped
    ports:
      - "${ARCADE_HTTP_PORT:-80}:80"
    depends_on:
      - battleblitz
      - sandwichstacker
      - pizzatron
      - cardjitsu
      - multiplayer

  battleblitz:
    build: ../battleblitz
    image: arcade/battleblitz:latest
    container_name: arcade-battleblitz
    restart: unless-stopped
    expose:
      - "80"

  sandwichstacker:
    build:
      context: ..
      dockerfile: sandwichstacker/Dockerfile
    image: arcade/sandwichstacker:latest
    container_name: arcade-sandwichstacker
    restart: unless-stopped
    expose:
      - "80"

  pizzatron:
    build:
      context: ..
      dockerfile: pizzatron/Dockerfile
    image: arcade/pizzatron:latest
    container_name: arcade-pizzatron
    restart: unless-stopped
    expose:
      - "80"

  cardjitsu:
    build:
      context: ..
      dockerfile: cardjitsu/Dockerfile
    image: arcade/cardjitsu:latest
    container_name: arcade-cardjitsu
    restart: unless-stopped
    expose:
      - "80"


  # Node service: multiplayer landing + lobby + the online Battle Blitz fork + its WebSocket.
  # Built from the repo root so battleblitz/assets can be copied in read-only.
  multiplayer:
    build:
      context: ..
      dockerfile: multiplayer/Dockerfile
    image: arcade/multiplayer:latest
    container_name: arcade-multiplayer
    restart: unless-stopped
    environment:
      MP_DIFFICULTY: "${MP_DIFFICULTY:-1}"
    expose:
      - "80"

  # Optional: publish the arcade to the internet through Tailscale Funnel (HTTPS at
  # https://arcade.<tailnet>.ts.net/), with no port forwarding. Needs TS_AUTHKEY in compose/.env and
  # COMPOSE_PROFILES=public (see .env.example). tailscale/serve.json proxies to the nginx container.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: arcade-tailscale
    hostname: arcade
    profiles: ["public"]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"   # from compose/.env
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    depends_on:
      - proxy

volumes:
  tailscale-state:
