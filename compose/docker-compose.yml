# Home arcade stack.
#   docker compose up -d --build
# The proxy is the only thing published; games are reached through it by path.
# Add a game: build its image as a service here, then add a `location` block in
# nginx/conf.d/arcade.conf and a card in nginx/html/index.html.

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: arcade-proxy
    restart: unless-stopped
    ports:
      - "${ARCADE_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - battleblitz
      - sandwichstacker
      - pizzatron
      - nobynobyboy

  battleblitz:
    build: ../battleblitz
    image: arcade/battleblitz:latest
    container_name: arcade-battleblitz
    restart: unless-stopped
    expose:
      - "80"

  sandwichstacker:
    build:
      context: ..
      dockerfile: sandwichstacker/Dockerfile
    image: arcade/sandwichstacker:latest
    container_name: arcade-sandwichstacker
    restart: unless-stopped
    expose:
      - "80"

  pizzatron:
    build:
      context: ..
      dockerfile: pizzatron/Dockerfile
    image: arcade/pizzatron:latest
    container_name: arcade-pizzatron
    restart: unless-stopped
    expose:
      - "80"

  nobynobyboy:
    build: ../nobynobyboy
    image: arcade/nobynobyboy:latest
    container_name: arcade-nobynobyboy
    restart: unless-stopped
    expose:
      - "80"
