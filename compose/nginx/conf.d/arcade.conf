# Front proxy for the arcade. The React shell (frontend/) is served from the root and shows each
# cabinet in a frame; the games hang off their own path prefixes, stripped before the request
# reaches the game container (the games use relative URLs so they don't need to know it).

# Game containers are addressed by name through Docker's DNS and re-resolved every few seconds,
# so rebuilding a game (new container IP) doesn't need a proxy restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: keeps whatever host/port the visitor used (and works behind another proxy).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # ---- games -------------------------------------------------------------
    location = /teen-titans-battle-blitz { return 301 /teen-titans-battle-blitz/; }
    location /teen-titans-battle-blitz/ {
        set $up_battleblitz http://battleblitz:80;
        rewrite ^/teen-titans-battle-blitz/(.*)$ /$1 break;   # strip the prefix (proxy_pass with a variable passes the URI as-is)
        proxy_pass $up_battleblitz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /teen-titans-battle-blitz;
    }

    location = /lilo-and-stitch-sandwich-stacker { return 301 /lilo-and-stitch-sandwich-stacker/; }
    location /lilo-and-stitch-sandwich-stacker/ {
        set $up_sandwichstacker http://sandwichstacker:80;
        rewrite ^/lilo-and-stitch-sandwich-stacker/(.*)$ /$1 break;   # strip the prefix (proxy_pass with a variable passes the URI as-is)
        proxy_pass $up_sandwichstacker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lilo-and-stitch-sandwich-stacker;
    }

    location = /club-penguin-pizzatron { return 301 /club-penguin-pizzatron/; }
    location /club-penguin-pizzatron/ {
        set $up_pizzatron http://pizzatron:80;
        rewrite ^/club-penguin-pizzatron/(.*)$ /$1 break;   # strip the prefix (proxy_pass with a variable passes the URI as-is)
        proxy_pass $up_pizzatron;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /club-penguin-pizzatron;
    }

    location = /club-penguin-card-jitsu { return 301 /club-penguin-card-jitsu/; }
    location /club-penguin-card-jitsu/ {
        set $up_cardjitsu http://cardjitsu:80;
        rewrite ^/club-penguin-card-jitsu/(.*)$ /$1 break;
        proxy_pass $up_cardjitsu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /club-penguin-card-jitsu;
    }

    location = /noby-noby-boy { return 301 /noby-noby-boy/; }
    location /noby-noby-boy/ {
        set $up_nobynobyboy http://nobynobyboy:80;
        rewrite ^/noby-noby-boy/(.*)$ /$1 break;
        proxy_pass $up_nobynobyboy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /noby-noby-boy;
    }

    # ---- multiplayer service (Node: pages + API + WebSocket) ---------------
    # The service knows its prefix (BASE_PATH), so nothing is stripped here.
    location = /arcade/multiplayer { return 301 /arcade/multiplayer/; }
    location = /arcade/multiplayer/ws {
        set $up_multiplayer http://multiplayer:80;
        proxy_pass $up_multiplayer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /arcade/multiplayer/ {
        set $up_multiplayer http://multiplayer:80;
        proxy_pass $up_multiplayer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- the front end (React SPA: /, /single/…, /multiplayer/…) -----------
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / {
        try_files $uri /index.html;
    }
}
