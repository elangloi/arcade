# Front proxy for the arcade. Each game hangs off its own path prefix; the prefix is
# stripped before the request reaches the game container, and the games use relative
# URLs so they don't need to know it.

upstream battleblitz { server battleblitz:80; }

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # ---- games -------------------------------------------------------------
    location = /teen-titans-battle-blitz { return 301 /teen-titans-battle-blitz/; }
    location /teen-titans-battle-blitz/ {
        proxy_pass http://battleblitz/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /teen-titans-battle-blitz;
    }

    # ---- landing page ------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
