      <rect x="36" y="78" width="10" height="20" rx="4"/><rect x="60" y="78" width="10" height="20" rx="4"/>
      <rect x="190" y="78" width="10" height="20" rx="4"/><rect x="214" y="78" width="10" height="20" rx="4"/>
