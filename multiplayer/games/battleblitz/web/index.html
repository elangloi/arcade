<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teen Titans: Battle Blitz — 2P</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: 1200px; height: 800px; max-width: 100vw; max-height: calc(100vw * 2 / 3); background: #000; image-rendering: pixelated; outline: none; }
  #status { min-height: 1.2em; color: #9a9; }
  #help { color: #777; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<canvas id="stage" width="600" height="400" tabindex="0"></canvas>
<div id="status">Loading…</div>
<div id="help">Arrows: move / jump &nbsp;·&nbsp; Down: block &nbsp;·&nbsp; Z: punch &nbsp;·&nbsp; X: kick &nbsp;·&nbsp; Esc: leave the match</div>
<script type="module" src="main.js"></script>
</body>
</html>
