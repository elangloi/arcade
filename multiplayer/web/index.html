<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplayer Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="back"><a href="../">&larr; the arcade</a></nav>
<header>
  <h1><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--pink)"/></svg>Multiplayer<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--pink)"/></svg></h1>
  <p class="sub"><span class="coin"></span>two players · one cabinet each</p>
  <p><span class="badge" id="stats"><i></i><span>connecting…</span></span></p>
</header>

<div class="games">
  <a class="cab" href="lobby.html">
    <div class="body">
      <div class="marquee">Teen Titans<br>Battle Blitz <small>2P online</small></div>
      <div class="screen">
        <span class="art blitz">
          <span class="floor"></span>
          <img class="robin" src="img/robin.png" alt="Robin">
          <span class="vs">VS</span>
          <img class="jinx" src="img/jinx.png" alt="Jinx">
        </span>
      </div>
      <span class="tag">Titans vs villains · best of 3</span>
      <div class="panel"><span class="stick"></span><span class="stick"></span><span class="btns"><i></i><i></i><i></i></span></div>
      <div class="coinslot"></div>
    </div>
  </a>

  <span class="cab soon">
    <div class="body">
      <div class="marquee">Coming soon</div>
      <div class="screen"><span class="art soon">insert coin</span></div>
      <span class="tag">more machines later</span>
      <div class="panel"><span class="stick"></span><span class="btns"><i></i><i></i><i></i></span></div>
      <div class="coinslot"></div>
    </div>
  </span>
</div>

<footer>find an opponent · pick a side · fight</footer>
<script>
  // "N playing now" badge.
  const el = document.querySelector('#stats span');
  async function refresh() {
    try {
      const s = await (await fetch('api/stats', { cache: 'no-store' })).json();
      el.textContent = `${s.online} online · ${s.queued} waiting · ${s.playing} fighting`;
    } catch { el.textContent = 'offline'; }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
