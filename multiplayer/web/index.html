<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplayer Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="/nav/nav.js" defer></script>
<svg class="deco" viewBox="0 0 24 24" style="left:6vw; top:14vh; animation-delay:-2s" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--yellow)"/></svg>
<svg class="deco" viewBox="0 0 24 24" style="right:8vw; top:22vh; animation-delay:-4s" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z" fill="var(--pink)"/></svg>
<svg class="deco" viewBox="0 0 24 24" style="left:12vw; bottom:12vh; animation-delay:-1s" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z" fill="var(--red)"/></svg>
<svg class="deco" viewBox="0 0 24 24" style="right:14vw; bottom:16vh; animation-delay:-3s" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--pink)"/></svg>

<header>
  <svg class="claw" viewBox="0 0 72 110" aria-hidden="true">
    <rect x="34" y="0" width="4" height="46" fill="#c9cdf5"/>
    <rect x="26" y="44" width="20" height="14" rx="4" fill="#fbf57a" stroke="#e5c94d" stroke-width="3"/>
    <path d="M36 58 C 14 66, 10 84, 20 100" fill="none" stroke="#ff5a72" stroke-width="7" stroke-linecap="round"/>
    <path d="M36 58 C 58 66, 62 84, 52 100" fill="none" stroke="#ff5a72" stroke-width="7" stroke-linecap="round"/>
    <path d="M36 58 L 36 96" fill="none" stroke="#ff5a72" stroke-width="7" stroke-linecap="round"/>
    <circle cx="36" cy="58" r="7" fill="#5566ff" stroke="#3a46c8" stroke-width="3"/>
  </svg>
  <h1><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--pink)"/></svg>Multiplayer<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="var(--pink)"/></svg></h1>
  <p class="sub"><span class="coin"></span>two players · one cabinet each</p>
  <p style="margin:12px 0 0"><span class="badge" id="stats"><i></i><span>connecting…</span></span></p>
</header>

<div class="games">
  <a class="cab" href="lobby.html">
    <div class="body">
      <div class="marquee">Teen Titans<br>Battle Blitz <small>2P online</small></div>
      <div class="screen">
        <span class="art blitz">
          <span class="floor"></span>
          <img class="robin" src="img/robin.png" alt="Robin">
          <span class="vs">VS</span>
          <img class="jinx" src="img/jinx.png" alt="Jinx">
        </span>
      </div>
      <span class="tag">Titans vs villains · best of 3</span>
      <div class="panel"><span class="stick"></span><span class="stick"></span><span class="btns"><i></i><i></i><i></i></span></div>
      <div class="coinslot"></div>
    </div>
  </a>

  <span class="cab soon">
    <div class="body">
      <div class="marquee">Coming soon</div>
      <div class="screen"><span class="art soon"><span class="zz">z z z</span>insert coin</span></div>
      <span class="tag">more machines later</span>
      <div class="panel"><span class="stick"></span><span class="btns"><i></i><i></i><i></i></span></div>
      <div class="coinslot"></div>
    </div>
  </span>
</div>

<footer>find an opponent · pick a side · fight</footer>
<script>
  // "N playing now" badge.
  const el = document.querySelector('#stats span');
  async function refresh() {
    try {
      const s = await (await fetch('api/stats', { cache: 'no-store' })).json();
      el.textContent = `${s.online} online · ${s.queued} waiting · ${s.playing} fighting`;
    } catch { el.textContent = 'offline'; }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
