# nginx config for the Noby Noby Boy container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects so the game also works under a proxy path prefix (/noby-noby-boy/ -> .../web/).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = / { return 302 web/; }
    location = /web { return 302 web/; }

    # Three.js never changes between builds -> cache hard; the game code always revalidates.
    location /web/vendor/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /web/ { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
