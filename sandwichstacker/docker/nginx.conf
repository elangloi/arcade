# nginx config for the Sandwich Stacker game container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects so the game also works under a proxy path prefix
    # (e.g. /lilo-and-stitch-sandwich-stacker/ -> /lilo-and-stitch-sandwich-stacker/web/).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location = / { return 302 web/; }
    location = /web { return 302 web/; }

    # Art, sounds and timeline data never change between builds -> cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Game code: always revalidate so updates show up after a rebuild.
    location /web/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
