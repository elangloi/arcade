<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>625 Sandwich Stacker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: min(1160px, 100vw); aspect-ratio: 580 / 320; background: #000; display: block; }
  #status { min-height: 1.2em; color: #9a9; }
  #help { color: #777; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<script src="/nav/nav.js" defer></script>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<div id="status">Loading…</div>
<div id="help">Left / Right arrows move Reuben's plate. Catch the good stuff, dodge the rotten stuff, finish with bread.</div>
<script type="module">
  import { boot } from './game.js';
  boot(document.getElementById('stage')).then(p => { document.getElementById('status').textContent = ''; window.P = p; })
    .catch(e => { console.error(e); document.getElementById('status').textContent = 'Failed to start: ' + e.message; });
</script>
</body>
</html>
